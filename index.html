<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roleta de prêmios</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #171325;
      color: #fff8ef;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #322548, #171325 70%);
    }

    main {
      width: min(88vw, 27rem);
      padding: 2rem 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 1.75rem;
      font-size: clamp(1.9rem, 7vw, 3rem);
      line-height: 1.1;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #fff8ef;
      outline-offset: 5px;
    }

    button[aria-disabled="true"] {
      cursor: wait;
    }

    .wheel-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
    }

    .pointer {
      position: absolute;
      z-index: 1;
      top: -.55rem;
      left: 50%;
      transform: translateX(-50%);
      width: 2rem;
      height: 2rem;
      background: #fff8ef;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .wheel {
      box-sizing: border-box;
      position: relative;
      display: block;
      aspect-ratio: 1;
      border: .4rem solid #fff8ef;
      border-radius: 50%;
      box-shadow: 0 1rem 2rem #100b1d88;
      background: conic-gradient(from -36deg,
        #ffcb70 0deg 72deg,
        #f492a5 72deg 144deg,
        #bca3ff 144deg 216deg,
        #85ddd3 216deg 288deg,
        #a9d692 288deg 360deg);
    }

    .prize {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: start center;
      padding-top: 14%;
      transform: rotate(var(--angle));
      color: #20162a;
      font-size: clamp(.875rem, 3.7vw, 1.15rem);
      font-weight: 750;
    }

    .prize span {
      max-width: 6em;
      line-height: 1.1;
      transform: rotate(calc(-1 * var(--angle)));
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 44%;
      border: .25rem solid #fff8ef;
      border-radius: 50%;
      background: #251a36;
    }

    .spin-button {
      margin-top: 1.5rem;
      padding: .7rem 1.8rem;
      border: 0;
      border-radius: 2rem;
      background: #ffcb70;
      color: #20162a;
      font-weight: 750;
    }

    #result {
      min-height: 1.5em;
      margin: .8rem 0 0;
      font-size: 1.15rem;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <h1>Roleta de prêmios</h1>
    <button class="wheel-button" type="button"
      aria-label="Girar a roleta. Prêmios: Cinema, pipoca, chocolate, refrigerante e Motinha elétrica.">
      <span class="pointer" aria-hidden="true"></span>
      <span class="wheel" aria-hidden="true">
        <span class="prize" style="--angle: 0deg"><span>Cinema</span></span>
        <span class="prize" style="--angle: 72deg"><span>pipoca</span></span>
        <span class="prize" style="--angle: 144deg"><span>chocolate</span></span>
        <span class="prize" style="--angle: 216deg"><span>refrigerante</span></span>
        <span class="prize" style="--angle: 288deg"><span>Motinha elétrica</span></span>
      </span>
    </button>
    <button class="spin-button" type="button">Girar roleta</button>
    <p id="result" role="status"></p>
  </main>
  <script>
    const wheel = document.querySelector(".wheel");
    const controls = document.querySelectorAll("button");
    const result = document.querySelector("#result");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let spinning = false;

    async function spin() {
      if (spinning) return;
      spinning = true;
      controls.forEach(button => button.setAttribute("aria-disabled", "true"));
      result.textContent = "Girando…";

      // Cinema fica no topo, então cinco voltas completas o alinham ao ponteiro.
      await wheel.animate(
        [{ transform: "rotate(0turn)" }, { transform: "rotate(5turn)" }],
        { duration: reducedMotion.matches ? 0 : 3500, easing: "cubic-bezier(.12,.75,.12,1)" }
      ).finished;

      result.textContent = "Você ganhou: Cinema!";
      spinning = false;
      controls.forEach(button => button.removeAttribute("aria-disabled"));
    }

    controls.forEach(button => button.addEventListener("click", spin));
  </script>
</body>
</html>
